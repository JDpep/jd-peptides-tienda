{% extends "base.html" %}
{% block title %}Iniciar sesión — JD Peptides{% endblock %}
{% block meta_description %}Accede a tu cuenta JD Peptides para ver tu historial de pedidos y datos guardados.{% endblock %}

{% block content %}
<section style="max-width:420px;margin:3rem auto;padding:0 1rem">
  <h1 style="font-size:1.75rem;margin-bottom:0.5rem;color:var(--text)">Iniciar sesión</h1>
  <p style="color:var(--text2);margin-bottom:2rem;font-size:0.95rem">¿Aún no tienes cuenta? <a href="{{ url_for('cuenta_registro', next=next) }}" style="color:var(--gold)">Regístrate</a></p>

  <form method="post" action="{{ url_for('cuenta_login') }}" class="form-card" style="display:flex;flex-direction:column;gap:1rem">
    <input type="hidden" name="next" value="{{ next }}">

    <div class="form-group">
      <label>Email</label>
      <input type="email" name="email" class="form-control" required autocomplete="email"
             value="{{ email }}" autofocus>
    </div>

    <div class="form-group">
      <label>Contraseña</label>
      <input type="password" name="password" class="form-control" required autocomplete="current-password" minlength="8">
    </div>

    <button type="submit" class="btn btn-gold btn-lg" style="margin-top:0.5rem">Entrar</button>
  </form>
</section>
{% endblock %}
